paths:
  corpus_pointer: "03_outputs/01_results_labelings/01_results_datasets/latest_merged_deduped_run.txt"
  artifacts_root: "03_outputs/01_results_labelings/06_phase2_coarticulation"

corpus_filters:
  # drop_residue = drop rows that ARE scrape residue (headline soup, promo /
  # hotline / syndication blocks), keep rows that are real sentences carrying a
  # scrape prefix (timestamps, Google-News follow line) with boiler_tier=prefix.
  # drop_all = drop any marker; flag_only = keep everything, flag only.
  # Patterns and tiers live in utils/boilerplate.py.
  boilerplate_policy: drop_residue

strata:
  camps: [DPP, KMT, TPP]
  genres_main: [news, debate]
  social_policy: exclude
  stratification_schemes:
    - name: camp_genre
      groupby: [camp, genre]
    - name: camp
      groupby: [camp]
    - name: camp_time
      groupby: [camp, time_bucket]
  unknown_camp_policy: drop_with_audit

windows:
  default_n: 3
  step: 1
  short_doc_policy: truncate
  # n=1 是同句捆绑，n=2 是最小的跨句尺度，n=3 是主规格：三档一起看才能定位
  # "共articulation 的尺度是句子" 这条负结果在哪一步开始衰减。
  robustness_ns: [1, 2, 5, document]
  robustness_run: true

npmi:
  min_marginal_count: 30
  min_stratum_windows: 500
  empty_l2_in_denominator: true
  edge_selection: fdr
  fdr_alpha: 0.05

bootstrap:
  n_resamples: 1000
  n_resamples_dev: 200
  ci_alpha: 0.05
  seed_base: 42
  n_jobs: -1

leiden:
  gammas: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0]
  seeds_per_gamma: 10
  seed_base: 123
  consensus_threshold: 0.5
  # Median of sweep; post-threshold consensus graph is resolution-agnostic (L&F 2012).
  consensus_gamma: 1.0
  stability_coassignment_min: 0.8

cross_camp:
  top_k_communities: 3
  qap_permutations: 1000
  primary_network_scheme: camp
  shared_jaccard_threshold: 0.66
  camp_permutation_n: 1000
  camp_permutation_n_dev: 100
  camp_permutation_seed_base: 42

smoke:
  doc_ids: []
  bootstrap_n: 50
